0LCJ5Ijo1OTZ9LHsieCI6MTg0LCJ5Ijo2MzZ9XQ==" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/><path d="M162,804L162,816.9289321881345Q162,824 154.92893218813452,824L95.07106781186548,824Q88,824 88,831.0710678118655L88,852" id="my-svg-L_O_P_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style="stroke-dasharray: 0 0 112.67171478271484 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_O_P_0" data-points="W3sieCI6MTYyLCJ5Ijo4MDR9LHsieCI6MTYyLCJ5Ijo4MjR9LHsieCI6ODgsInkiOjgyNH0seyJ4Ijo4OCwieSI6ODU2fV0=" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/><path d="M88,1000L88,1048" id="my-svg-L_P_R_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style="stroke-dasharray: 0 0 44 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_P_R_0" data-points="W3sieCI6ODgsInkiOjEwMDB9LHsieCI6ODgsInkiOjEwNTJ9XQ==" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/><path d="M88,1196L88,1232" id="my-svg-L_R_N_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style="stroke-dasharray: 0 0 32 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_R_N_0" data-points="W3sieCI6ODgsInkiOjExOTZ9LHsieCI6ODgsInkiOjEyMzZ9XQ==" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/><path d="M206,804L206,816.9289321881345Q206,824 213.07106781186548,824L272.9289321881345,824Q280,824 280,831.0710678118655L280,840" id="my-svg-L_O_X_0" class="edge-thickness-normal edge-pattern-dotted edge-thickness-normal edge-pattern-solid flowchart-link" style="stroke-dasharray: 0 0 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_O_X_0" data-points="W3sieCI6MjA2LCJ5Ijo4MDR9LHsieCI6MjA2LCJ5Ijo4MjR9LHsieCI6MjgwLCJ5Ijo4MjR9LHsieCI6MjgwLCJ5Ijo4NDR9XQ==" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/></g><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-C-0" data-look="neo" transform="translate(184, 84)"><rect class="basic label-container" style="" x="-76" y="-72" width="152" height="144"/><g class="label" style="" transform="translate(-60, -60)"><rect/><foreignObject width="120" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>主張：學業結果的歸因須摒棄單一績優主義，正視家庭財富與社會背景的約束</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W1-1" data-look="neo" transform="translate(184, 292)"><rect class="basic label-container" style="" x="-76" y="-96" width="152" height="192"/><g class="label" style="" transform="translate(-60, -84)"><rect/><foreignObject width="120" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>憑據一：3,630 名已畢業與已退學學生上，財富背景的 McFadden R² 為 0.2227，居三層之首</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W2-2" data-look="neo" transform="translate(184, 512)"><rect class="basic label-container" style="" x="-76" y="-84" width="152" height="168"/><g class="label" style="" transform="translate(-60, -72)"><rect/><foreignObject width="120" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>憑據二：能力的邊際貢獻只新增 R² 0.05999，父母文化資本的獨立貢獻為 0.01572</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-O-3" data-look="neo" transform="translate(184, 720)"><rect class="basic label-container" style="" x="-76" y="-84" width="152" height="168"/><g class="label" style="" transform="translate(-60, -72)"><rect/><foreignObject width="120" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>條件：三層各有一條說得出的機制（欠繳早於退學、獎學金吸收衝擊、能力在校累積）</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P-4" data-look="neo" transform="translate(88, 928)"><rect class="basic label-container" style="" x="-76" y="-72" width="152" height="144"/><g class="label" style="" transform="translate(-60, -60)"><rect/><foreignObject width="120" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>對策：繳費狀態與資助資格列為預警第一順位；資助與學術支援在同一點投放</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-5" data-look="neo" transform="translate(88, 1124)"><rect class="basic label-container" style="" x="-76" y="-72" width="152" height="144"/><g class="label" style="" transform="translate(-60, -60)"><rect/><foreignObject width="120" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>結論：學業結果的底層結構是財務條件，政策應以財務支持為核心</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-N-6" data-look="neo" transform="translate(88, 1296)"><rect class="basic label-container" style="" x="-76" y="-60" width="152" height="120"/><g class="label" style="" transform="translate(-60, -48)"><rect/><foreignObject width="120" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>批評對象：績優主義，即把學業結果直接歸因於固有能力</p></span></div></foreignObject></g></g><g class="node default open" id="my-svg-flowchart-X-7" data-look="neo" transform="translate(280, 928)"><rect class="basic label-container" style="stroke-dasharray:5 5 !important;stroke:#b45309 !important;fill:#fffbeb !important" x="-76" y="-84" width="152" height="168"/><g class="label" style="color:#92400e !important" transform="translate(-60, -72)"><rect/><foreignObject width="120" height="144"><div style="color: rgb(146, 64, 14) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#92400e !important" class="nodeLabel"><p>限制：社經背景只在一個時點記錄、退學理由在紀錄中空白，因果以時序領先立論</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"/><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"/></linearGradient></svg>