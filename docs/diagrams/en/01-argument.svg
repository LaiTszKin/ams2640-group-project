data-et="edge" data-id="L_O_X_0" data-points="W3sieCI6NTU2LCJ5Ijo0NzUuNX0seyJ4Ijo1NTYsInkiOjQ5NS41fSx7IngiOjczMCwieSI6NDk1LjV9LHsieCI6NzMwLCJ5Ijo1MTUuNX1d" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/></g><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-C-0" data-look="neo" transform="translate(484, 57.75)"><rect class="basic label-container" style="" x="-226" y="-45.75" width="452" height="91.5"/><g class="label" style="" transform="translate(-210, -33.75)"><rect/><foreignObject width="420" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Claim: the attribution of academic outcomes must abandon single-minded meritocratic worship and face the constraint that family wealth and social background impose</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W1-1" data-look="neo" transform="translate(484, 189.25)"><rect class="basic label-container" style="" x="-226" y="-45.75" width="452" height="91.5"/><g class="label" style="" transform="translate(-210, -33.75)"><rect/><foreignObject width="420" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Warrant 1: across 3,630 graduated and withdrawn students, wealth background carries the largest McFadden R² of the three layers, 0.2227</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W2-2" data-look="neo" transform="translate(484, 309.5)"><rect class="basic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Warrant 2: ability adds only R² 0.05999, and parental cultural capital contributes 0.01572 on its own</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-O-3" data-look="neo" transform="translate(484, 429.75)"><rect class="basic label-container" style="" x="-226" y="-45.75" width="452" height="91.5"/><g class="label" style="" transform="translate(-210, -33.75)"><rect/><foreignObject width="420" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Condition: each layer has a statable mechanism (non-payment precedes withdrawal, the scholarship absorbs the shock, ability accumulates during study)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P-4" data-look="neo" transform="translate(238, 561.25)"><rect class="basic label-container" style="" x="-226" y="-45.75" width="452" height="91.5"/><g class="label" style="" transform="translate(-210, -33.75)"><rect/><foreignObject width="420" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Policy: payment status and funding eligibility rank first in the early-warning system; financial aid and academic support are delivered at the same point</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-5" data-look="neo" transform="translate(238, 681.5)"><rect class="basic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Conclusion: the underlying structure of academic outcomes is financial condition, so policy should centre on financial support</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-N-6" data-look="neo" transform="translate(238, 790.5)"><rect class="basic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Object of criticism: meritocratic worship, i.e. attributing academic outcomes directly to fixed ability</p></span></div></foreignObject></g></g><g class="node default open" id="my-svg-flowchart-X-7" data-look="neo" transform="translate(730, 561.25)"><rect class="basic label-container" style="stroke-dasharray:5 5 !important;stroke:#b45309 !important;fill:#fffbeb !important" x="-226" y="-45.75" width="452" height="91.5"/><g class="label" style="color:#92400e !important" transform="translate(-210, -33.75)"><rect/><foreignObject width="420" height="67.5"><div style="color: rgb(146, 64, 14) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#92400e !important" class="nodeLabel"><p>Limitation: socio-economic background is recorded at a single point in time and the grounds for withdrawal are blank in the records, so causation rests on temporal precedence ([Q25])</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><de