ic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Claim: individual ability is not the sole dominant factor in whether a student graduates</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W1-1" data-look="neo" transform="translate(484, 166.75)"><rect class="basic label-container" style="" x="-226" y="-45.75" width="452" height="91.5"/><g class="label" style="" transform="translate(-210, -33.75)"><rect/><foreignObject width="420" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Warrant 1: ability runs through the whole period of study, and outside that process there are also conditions of subsistence and an already-given social background</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W2-2" data-look="neo" transform="translate(484, 287)"><rect class="basic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Warrant 2: each of the three layers has measurable fields (social background 7, wealth 3, macro 3)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-O-3" data-look="neo" transform="translate(484, 396)"><rect class="basic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Condition: the other factors are significant, and a mechanism can be stated behind them</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-4" data-look="neo" transform="translate(238, 505)"><rect class="basic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Conclusion: academic achievement is not the monopoly of ability</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-N-5" data-look="neo" transform="translate(238, 614)"><rect class="basic label-container" style="" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="" transform="translate(-210, -22.5)"><rect/><foreignObject width="420" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p>Object of criticism: meritocratic worship (jìyōu zhǔyì), not merit-based assessment (jìxiào zhǔyì)</p></span></div></foreignObject></g></g><g class="node default open" id="my-svg-flowchart-X-6" data-look="neo" transform="translate(730, 505)"><rect class="basic label-container" style="stroke-dasharray:5 5 !important;stroke:#b45309 !important;fill:#fffbeb !important" x="-226" y="-34.5" width="452" height="69"/><g class="label" style="color:#92400e !important" transform="translate(-210, -22.5)